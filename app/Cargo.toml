[package]
name = "morlaco"
description = "GNOME app that tracks wallet holdings and unrealized gains"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gtk4 = { version = "0.11.5", features = ["v4_10"] }
libadwaita = { version = "0.9.2", features = ["v1_5"] }
morlaco-core = { version = "0.1.0", path = "../core" }

[target.'cfg(target_os = "linux")'.dependencies]
libsecret = "0.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[lints]
workspace = true
