[package]
name = "morlaco-core"
description = "Chain history, pricing and FIFO lot accounting for Morlaco"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "0.41.0", features = ["bundled-sqlcipher"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
ureq = { version = "3.5.0", features = ["json"] }

[dev-dependencies]
serde_json = "1.0.154"
