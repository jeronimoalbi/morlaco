name: macOS

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install libraries
        run: brew install gtk4 libadwaita pkgconf openssl@3
      - name: Build and test
        run: |
          export OPENSSL_DIR="$(brew --prefix openssl@3)"
          cargo build --locked
          cargo test --locked
